<svg width="100%" height="auto" viewBox="0 0 425 56" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Filtro de Glow Neon Seguro Contra Clipping -->
    <filter id="neonCometGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur1" />
      <feGaussianBlur stdDeviation="1.5" result="blur2" />
      <feMerge>
        <feMergeNode in="blur1" />
        <feMergeNode in="blur2" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <!-- Gradiente Neon Multicor Vibrante (Ciano -> Azul -> Roxo -> Magenta) -->
    <linearGradient id="neonCometGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00f0ff" />
      <stop offset="30%" stop-color="#3b82f6" />
      <stop offset="65%" stop-color="#a855f7" />
      <stop offset="100%" stop-color="#ec4899" />
    </linearGradient>

    <style>
      .btn-cat { font-family: 'Fira Code', monospace; font-size: 9.5px; font-weight: 700; fill: #22d3ee; letter-spacing: 0.5px; }
      .btn-url { font-family: 'Fira Code', monospace; font-size: 10px; fill: #94a3b8; }
      
      /* Animação Sincronizada do Feixe Cometa Multicor (Card 3: 3.0s a 4.5s) */
      @keyframes cometSweep3 {
        0%, 14.286% { stroke-dashoffset: 933; opacity: 0; }
        14.786% { opacity: 1; }
        20.929% { opacity: 1; }
        21.429%, 100% { stroke-dashoffset: 0; opacity: 0; }
      }
      .comet-beam {
        stroke-dasharray: 170 763;
        animation: cometSweep3 21s linear infinite;
        pointer-events: none;
      }
    </style>
  </defs>

  <!-- Base Card Static Border -->
  <rect x="1" y="1" width="423" height="54" rx="12" fill="#081e2b" fill-opacity="0.45" stroke="#00f0ff" stroke-opacity="0.25" stroke-width="1.2" />
  <rect class="comet-beam" x="1.5" y="1.5" width="423" height="54" rx="12" fill="none" stroke="url(#neonCometGrad)" stroke-width="2.6" stroke-linecap="round" filter="url(#neonCometGlow)" pointer-events="none" />
  
  <!-- Feixe Cometa Neon Multicor (Ciano, Azul, Roxo e Magenta) -->
  <!-- Icon Box -->
  <g transform="translate(14, 11)">
    <rect width="34" height="34" rx="9" fill="#002b3d" stroke="#00f0ff" stroke-opacity="0.5" stroke-width="1" />
    <circle cx="17" cy="17" r="8" stroke="#22d3ee" stroke-width="1.3" fill="none" />
    <line x1="9" y1="17" x2="25" y2="17" stroke="#22d3ee" stroke-width="1.1" />
    <ellipse cx="17" cy="17" rx="4" ry="8" stroke="#22d3ee" stroke-width="1.1" fill="none" />
  </g>

  <!-- Texts -->
  <text x="58" y="24" class="btn-cat">PORTFÓLIO LIVE ↗</text>
  <text x="58" y="42" class="btn-url">helenilsoon.github.io/portifolio</text>

  <!-- Right Pill -->
  <g transform="translate(345, 18)">
    <rect width="66" height="20" rx="6" fill="#022c22" stroke="#10b981" stroke-opacity="0.5" stroke-width="1" />
    <circle cx="10" cy="10" r="3" fill="#10b981" />
    <text x="36" y="13.5" font-family="'Fira Code', monospace" font-size="8.5" fill="#34d399" font-weight="700" text-anchor="middle">ONLINE</text>
  </g>
</svg>
