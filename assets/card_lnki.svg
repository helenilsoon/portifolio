<svg width="100%" height="auto" viewBox="0 0 420 146" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Filtro de Brilho Neon Seguro -->
    <filter id="neonCometGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3.5" result="blur1" />
      <feGaussianBlur stdDeviation="1.5" result="blur2" />
      <feMerge>
        <feMergeNode in="blur1" />
        <feMergeNode in="blur2" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <!-- Gradiente Neon Multicor Vibrante (Ciano -> Azul -> Violeta -> Magenta) -->
    <linearGradient id="neonCometGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00f0ff" />
      <stop offset="30%" stop-color="#3b82f6" />
      <stop offset="65%" stop-color="#a855f7" />
      <stop offset="100%" stop-color="#ec4899" />
    </linearGradient>
    <filter id="blueGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="4" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
    <linearGradient id="cardBorder" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3b82f6" stop-opacity="0.8" />
      <stop offset="50%" stop-color="#1d4ed8" stop-opacity="0.4" />
      <stop offset="100%" stop-color="#06b6d4" stop-opacity="0.7" />
    </linearGradient>
    <style>
      .card-title { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; font-size: 14px; font-weight: 700; fill: #ffffff; }
      .card-desc { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; font-size: 11px; fill: #94a3b8; }
      .tag-txt { font-family: 'Fira Code', monospace; font-size: 9px; font-weight: 600; fill: #93c5fd; }
      .category { font-family: 'Fira Code', monospace; font-size: 10px; font-weight: bold; fill: #60a5fa; letter-spacing: 0.5px; }
      .arrow { font-family: 'Fira Code', monospace; font-size: 11.5px; fill: #60a5fa; font-weight: bold; }

      /* Pulso de Feixe de Dados em Loop */
      @keyframes pulseBeam {
        0% { stroke-dashoffset: 60; }
        100% { stroke-dashoffset: 0; }
      }
      @keyframes floatChain {
        0%, 100% { transform: translateY(0px) rotate(0deg); }
        50% { transform: translateY(-4px) rotate(3deg); }
      }
      .chain-3d {
        animation: floatChain 3.4s ease-in-out infinite;
        transform-origin: 375px 42px;
      }
      .beam-pulse {
        animation: pulseBeam 2s linear infinite;
      }
    
      /* Sincronizacao Cometa Neon: Passo 10 (64.26% a 71.40%) */
      @keyframes cometSweep10 {
        0%, 64.26% { stroke-dashoffset: 1120; opacity: 0; }
        64.66% { opacity: 1; }
        71.00% { opacity: 1; }
        71.40%, 100% { stroke-dashoffset: 0; opacity: 0; }
      }
      .comet-beam {
        stroke-dasharray: 168 952;
        animation: cometSweep10 21s linear infinite;
        pointer-events: none;
      }
    </style>
  </defs>

  <!-- Background Card -->
  <rect x="1.5" y="1.5" width="417" height="143" rx="14" fill="#080c14" stroke="url(#cardBorder)" stroke-width="1.4" />
  <rect class="comet-beam" x="1.5" y="1.5" width="417" height="143" rx="14" fill="none" stroke="url(#neonCometGrad)" stroke-width="2.6" stroke-linecap="round" filter="url(#neonCometGlow)" pointer-events="none" />

  <!-- Ambient Light -->
  <circle cx="375" cy="42" r="35" fill="#3b82f6" fill-opacity="0.08" filter="url(#blueGlow)" />

  <!-- Vector Chain Link Icon Left -->
  <rect x="20" y="18" width="28" height="28" rx="7" fill="#1e3a5f" fill-opacity="0.7" stroke="#3b82f6" stroke-opacity="0.5" stroke-width="1.2" />
  <path d="M29 33L32 30C33.5 28.5 36 28.5 37.5 30C39 31.5 39 34 37.5 35.5L34.5 38.5C33 40 30.5 40 29 38.5" stroke="#60a5fa" stroke-width="1.6" stroke-linecap="round" />
  <path d="M33 29L30 32C28.5 33.5 26 33.5 24.5 32C23 30.5 23 28 24.5 26.5L27.5 23.5C29 22 31.5 22 33 23.5" stroke="#60a5fa" stroke-width="1.6" stroke-linecap="round" />

  <text x="56" y="30" class="category">SaaS LINK MANAGEMENT</text>
  <text x="56" y="42" class="arrow">lnki.pro ↗</text>

  <!-- ================= ELOS DE CORRENTE / NÓ DE CONEXÃO 3D COM PULSO ================= -->
  <g class="chain-3d">
    <!-- Elo 1: Inclinado em 3D (Face Esquerda) -->
    <ellipse cx="366" cy="38" rx="13" ry="8" stroke="#3b82f6" stroke-width="3.5" fill="none" transform="rotate(-35 366 38)" />
    <ellipse cx="366" cy="38" rx="13" ry="8" stroke="#93c5fd" stroke-width="1.2" fill="none" transform="rotate(-35 366 38)" />

    <!-- Elo 2: Entrelaçado passando por dentro (Face Direita) -->
    <ellipse cx="384" cy="46" rx="13" ry="8" stroke="#00f0ff" stroke-width="3.5" fill="none" transform="rotate(35 384 46)" />
    <ellipse cx="384" cy="46" rx="13" ry="8" stroke="#ffffff" stroke-width="1.2" fill="none" transform="rotate(35 384 46)" />

    <!-- Feixe Laser de Dados Pulsando no Ponto de Conexão Central -->
    <circle cx="375" cy="42" r="4.5" fill="#00f0ff" filter="url(#blueGlow)" />
    <circle cx="375" cy="42" r="2" fill="#ffffff" />

    <!-- Pulso de dados que viaja pelo contorno -->
    <path d="M356 32 C366 22 384 32 394 42 C384 52 366 62 356 52 Z" stroke="#38bdf8" stroke-width="1.5" stroke-dasharray="10 20" fill="none" class="beam-pulse" filter="url(#blueGlow)" />
  </g>

  <!-- Title -->
  <text x="20" y="73" class="card-title">Lnki.pro • Encurtador Inteligente</text>

  <!-- Description -->
  <text x="20" y="93" class="card-desc">Plataforma SaaS com gateway Caddy, terminação TLS,</text>
  <text x="20" y="108" class="card-desc">landing pixel art, Redis e containers Docker.</text>

  <!-- Chips -->
  <g transform="translate(20, 117)">
    <rect width="78" height="20" rx="5" fill="#1e3a5f" fill-opacity="0.5" stroke="#3b82f6" stroke-opacity="0.3" />
    <text x="39" y="13.5" text-anchor="middle" class="tag-txt">Go (Golang)</text>
  </g>
  <g transform="translate(104, 117)">
    <rect width="58" height="20" rx="5" fill="#1e3a5f" fill-opacity="0.5" stroke="#3b82f6" stroke-opacity="0.3" />
    <text x="29" y="13.5" text-anchor="middle" class="tag-txt">Redis</text>
  </g>
  <g transform="translate(168, 117)">
    <rect width="66" height="20" rx="5" fill="#1e3a5f" fill-opacity="0.5" stroke="#3b82f6" stroke-opacity="0.3" />
    <text x="33" y="13.5" text-anchor="middle" class="tag-txt">Docker</text>
  </g>
</svg>
