<svg width="100%" height="auto" viewBox="0 0 500 240" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Filtro de Brilho Neon Seguro -->
    <filter id="neonCometGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3.5" result="blur1" />
      <feGaussianBlur stdDeviation="1.5" result="blur2" />
      <feMerge>
        <feMergeNode in="blur1" />
        <feMergeNode in="blur2" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <!-- Gradiente Neon Multicor Vibrante (Ciano -> Azul -> Violeta -> Magenta) -->
    <linearGradient id="neonCometGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00f0ff" />
      <stop offset="30%" stop-color="#3b82f6" />
      <stop offset="65%" stop-color="#a855f7" />
      <stop offset="100%" stop-color="#ec4899" />
    </linearGradient>
    <!-- Filtros de Glow Neon -->
    <filter id="coreGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
    <filter id="softGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="3" result="blur2" />
      <feComposite in="SourceGraphic" in2="blur2" operator="over" />
    </filter>

    <!-- Gradientes Neon -->
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00f0ff" stop-opacity="0.8" />
      <stop offset="50%" stop-color="#3b82f6" stop-opacity="0.3" />
      <stop offset="100%" stop-color="#a855f7" stop-opacity="0.8" />
    </linearGradient>

    <linearGradient id="faceTopGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00f0ff" stop-opacity="0.75" />
      <stop offset="100%" stop-color="#3b82f6" stop-opacity="0.4" />
    </linearGradient>

    <linearGradient id="faceLeftGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3b82f6" stop-opacity="0.6" />
      <stop offset="100%" stop-color="#1e1b4b" stop-opacity="0.85" />
    </linearGradient>

    <linearGradient id="faceRightGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#a855f7" stop-opacity="0.7" />
      <stop offset="100%" stop-color="#31104b" stop-opacity="0.85" />
    </linearGradient>

    <linearGradient id="gridGrad" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#00f0ff" stop-opacity="0.3" />
      <stop offset="100%" stop-color="#00f0ff" stop-opacity="0" />
    </linearGradient>

    <style>
      .hud-txt { font-family: 'Fira Code', monospace; font-size: 9.5px; fill: #00f0ff; letter-spacing: 0.5px; }
      .hud-sub { font-family: 'Fira Code', monospace; font-size: 8.5px; fill: #94a3b8; }
      .core-title { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; font-size: 13.5px; font-weight: 700; fill: #ffffff; }

      /* Animação de Flutuação 3D do Cubo */
      @keyframes float3D {
        0%, 100% { transform: translateY(0px) rotate(0deg); }
        50% { transform: translateY(-12px) rotate(1.5deg); }
      }
      .cube-float {
        animation: float3D 4s ease-in-out infinite;
        transform-origin: 250px 120px;
      }

      /* Rotação dos Anéis Orbitais Holográficos */
      @keyframes spinRing1 {
        0% { transform: rotate(0deg); }
        100% { transform: rotate(360deg); }
      }
      @keyframes spinRing2 {
        0% { transform: rotate(360deg); }
        100% { transform: rotate(0deg); }
      }
      @keyframes spinRing3 {
        0% { transform: rotate(45deg); }
        50% { transform: rotate(225deg); }
        100% { transform: rotate(405deg); }
      }
      .ring-1 {
        animation: spinRing1 12s linear infinite;
        transform-origin: 250px 115px;
      }
      .ring-2 {
        animation: spinRing2 8s linear infinite;
        transform-origin: 250px 115px;
      }
      .ring-3 {
        animation: spinRing3 10s ease-in-out infinite;
        transform-origin: 250px 115px;
      }

      /* Pulso do Núcleo de Energia */
      @keyframes pulseLight {
        0%, 100% { opacity: 0.3; r: 35px; }
        50% { opacity: 0.7; r: 45px; }
      }
      .aura-pulse {
        animation: pulseLight 3s ease-in-out infinite;
      }

      /* Linhas de Scanner Holográfico */
      @keyframes scanBeam {
        0% { y1: 50; y2: 50; opacity: 0; }
        20% { opacity: 0.8; }
        80% { opacity: 0.8; }
        100% { y1: 180; y2: 180; opacity: 0; }
      }
      .scanner {
        animation: scanBeam 3.5s ease-in-out infinite;
      }
    
      /* Sincronizacao Cometa Neon: Passo 13 (85.68% a 92.82%) */
      @keyframes cometSweep13 {
        0%, 85.68% { stroke-dashoffset: 1468; opacity: 0; }
        86.08% { opacity: 1; }
        92.42% { opacity: 1; }
        92.82%, 100% { stroke-dashoffset: 0; opacity: 0; }
      }
      .comet-beam {
        stroke-dasharray: 220 1248;
        animation: cometSweep13 21s linear infinite;
        pointer-events: none;
      }
    </style>
  </defs>

  <!-- Card Background -->
  <rect x="1.5" y="1.5" width="497" height="237" rx="14" fill="#060911" stroke="url(#cardGrad)" stroke-width="1.4" />
  <rect class="comet-beam" x="1.5" y="1.5" width="497" height="237" rx="14" fill="none" stroke="url(#neonCometGrad)" stroke-width="2.6" stroke-linecap="round" filter="url(#neonCometGlow)" pointer-events="none" />

  <!-- 3D Perspective Ground Grid (Chão de Néon Estilo Synthwave) -->
  <g opacity="0.35">
    <!-- Linhas de perspectiva convergentes -->
    <line x1="250" y1="120" x2="30" y2="238" stroke="url(#gridGrad)" stroke-width="1" />
    <line x1="250" y1="120" x2="100" y2="238" stroke="url(#gridGrad)" stroke-width="1" />
    <line x1="250" y1="120" x2="175" y2="238" stroke="url(#gridGrad)" stroke-width="1" />
    <line x1="250" y1="120" x2="250" y2="238" stroke="url(#gridGrad)" stroke-width="1.2" stroke-dasharray="3 3" />
    <line x1="250" y1="120" x2="325" y2="238" stroke="url(#gridGrad)" stroke-width="1" />
    <line x1="250" y1="120" x2="400" y2="238" stroke="url(#gridGrad)" stroke-width="1" />
    <line x1="250" y1="120" x2="470" y2="238" stroke="url(#gridGrad)" stroke-width="1" />
    
    <!-- Linhas horizontais com espaçamento de perspectiva -->
    <line x1="190" y1="160" x2="310" y2="160" stroke="#00f0ff" stroke-opacity="0.15" stroke-width="0.8" />
    <line x1="150" y1="180" x2="350" y2="180" stroke="#00f0ff" stroke-opacity="0.25" stroke-width="0.9" />
    <line x1="100" y1="205" x2="400" y2="205" stroke="#00f0ff" stroke-opacity="0.4" stroke-width="1" />
    <line x1="40" y1="235" x2="460" y2="235" stroke="#00f0ff" stroke-opacity="0.6" stroke-width="1.2" />
  </g>

  <!-- Aura de Energia Central -->
  <circle cx="250" cy="115" r="40" fill="#00f0ff" class="aura-pulse" filter="url(#coreGlow)" />
  <circle cx="250" cy="115" r="30" fill="#a855f7" opacity="0.3" filter="url(#coreGlow)" />

  <!-- Sombra 3D no Chão sob o Cubo -->
  <ellipse cx="250" cy="210" rx="60" ry="12" fill="#00f0ff" fill-opacity="0.15" filter="url(#coreGlow)" />
  <ellipse cx="250" cy="210" rx="35" ry="6" fill="#a855f7" fill-opacity="0.25" filter="url(#coreGlow)" />

  <!-- Anel Orbital 1 (Giroscópio 3D Externo) -->
  <g class="ring-1">
    <ellipse cx="250" cy="115" rx="95" ry="32" stroke="#00f0ff" stroke-width="1.4" stroke-opacity="0.75" fill="none" stroke-dasharray="8 6 18 6" filter="url(#softGlow)" />
    <!-- Satélite / Partícula 3D no Anel 1 -->
    <circle cx="345" cy="115" r="3.5" fill="#00f0ff" filter="url(#softGlow)" />
    <circle cx="155" cy="115" r="2.5" fill="#38bdf8" />
  </g>

  <!-- Anel Orbital 2 (Inclinado oposto) -->
  <g class="ring-2">
    <ellipse cx="250" cy="115" rx="80" ry="28" stroke="#a855f7" stroke-width="1.3" stroke-opacity="0.7" fill="none" stroke-dasharray="14 8 4 8" filter="url(#softGlow)" transform="rotate(-30 250 115)" />
    <!-- Partícula 3D no Anel 2 -->
    <circle cx="330" cy="115" r="3" fill="#c084fc" transform="rotate(-30 250 115)" filter="url(#softGlow)" />
  </g>

  <!-- Anel Orbital 3 (Vertical / Giro rápido) -->
  <g class="ring-3">
    <ellipse cx="250" cy="115" rx="65" ry="22" stroke="#34d399" stroke-width="1.1" stroke-opacity="0.6" fill="none" stroke-dasharray="6 4" transform="rotate(60 250 115)" />
  </g>

  <!-- ================= CUBO 3D HOLOGRÁFICO (FLUTUANTE) ================= -->
  <g class="cube-float">
    <!-- Centro do Cubo: (250, 115). Raio isométrico: R = 44 -->
    <!-- Coordenadas dos vértices:
         Topo centro: (250, 115)
         Vértice Superior: (250, 71)
         Vértice Superior-Direito: (288, 93)
         Vértice Inferior-Direito: (288, 137)
         Vértice Inferior: (250, 159)
         Vértice Inferior-Esquerdo: (212, 137)
         Vértice Superior-Esquerdo: (212, 93)
    -->

    <!-- Face 1: Topo (Losango) -->
    <polygon points="250,71 288,93 250,115 212,93" fill="url(#faceTopGrad)" stroke="#00f0ff" stroke-width="1.3" />
    
    <!-- Face 2: Esquerda (Paralelogramo) -->
    <polygon points="212,93 250,115 250,159 212,137" fill="url(#faceLeftGrad)" stroke="#38bdf8" stroke-width="1.3" />
    
    <!-- Face 3: Direita (Paralelogramo) -->
    <polygon points="250,115 288,93 288,137 250,159" fill="url(#faceRightGrad)" stroke="#a855f7" stroke-width="1.3" />

    <!-- Arestas Iluminadas Internas (Wireframe 3D) -->
    <line x1="250" y1="115" x2="250" y2="159" stroke="#ffffff" stroke-width="1.6" stroke-opacity="0.8" />
    <line x1="250" y1="115" x2="212" y2="93" stroke="#ffffff" stroke-width="1.2" stroke-opacity="0.6" />
    <line x1="250" y1="115" x2="288" y2="93" stroke="#ffffff" stroke-width="1.2" stroke-opacity="0.6" />

    <!-- Símbolo / Core Central dentro do Topo -->
    <circle cx="250" cy="93" r="5" fill="#00f0ff" filter="url(#softGlow)" />
    <circle cx="250" cy="93" r="8" stroke="#ffffff" stroke-width="0.8" fill="none" opacity="0.8" />

    <!-- Inscrição Isométrica na Face Direita -->
    <text x="268" y="138" font-family="'Fira Code', monospace" font-size="7" fill="#e9d5ff" font-weight="700" transform="skewY(30) translate(-35, -95)">WEBUILD</text>

    <!-- Inscrição Isométrica na Face Esquerda -->
    <text x="216" y="138" font-family="'Fira Code', monospace" font-size="7" fill="#bae6fd" font-weight="700" transform="skewY(-30) translate(95, 140)">FULLSTACK</text>
  </g>

  <!-- Feixe Scanner Laser Holográfico -->
  <line x1="180" y1="100" x2="320" y2="100" stroke="#00f0ff" stroke-width="1.2" stroke-opacity="0.7" class="scanner" filter="url(#softGlow)" />

  <!-- ================= HUD HOLOGRÁFICO SUPERIOR ESQUERDO ================= -->
  <g transform="translate(18, 18)">
    <rect width="18" height="18" rx="4" fill="#002b3d" stroke="#00f0ff" stroke-opacity="0.5" stroke-width="1" />
    <circle cx="9" cy="9" r="3" fill="#00f0ff" />
    <text x="26" y="14" class="core-title">Cyber Core 3D • Sistema Ativo</text>
    <text x="0" y="32" class="hud-txt">> ENGINE: VECTORIAL_3D_ISOMETRIC</text>
    <text x="0" y="44" class="hud-sub">Status: 60 FPS • Pure SVG Matrix Loop</text>
  </g>

  <!-- ================= HUD HOLOGRÁFICO SUPERIOR DIREITO ================= -->
  <g transform="translate(365, 18)">
    <rect width="118" height="22" rx="6" fill="#022c22" stroke="#10b981" stroke-opacity="0.4" stroke-width="1" />
    <circle cx="12" cy="11" r="3" fill="#10b981" />
    <text x="64" y="14.5" font-family="'Fira Code', monospace" font-size="9" fill="#34d399" font-weight="700" text-anchor="middle">HOLOGRAPHIC // ON</text>
    
    <text x="118" y="34" class="hud-txt" text-anchor="end">ROT: 360° // X:Y:Z</text>
    <text x="118" y="46" class="hud-sub" text-anchor="end">COORD: 0x7F // LIVE</text>
  </g>

  <!-- HUD Inferior: Micro-Telemetria -->
  <g transform="translate(18, 218)">
    <circle cx="4" cy="-4" r="2" fill="#00f0ff" />
    <text x="12" y="0" class="hud-sub">SCALE: 1:1 • ISOMETRIC PERSPECTIVE MATRIX • WEBUILDSOFT INC © 2026</text>
  </g>
</svg>
