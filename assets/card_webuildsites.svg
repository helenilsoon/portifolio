<svg width="100%" height="auto" viewBox="0 0 420 146" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Filtro de Brilho Neon Seguro -->
    <filter id="neonCometGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3.5" result="blur1" />
      <feGaussianBlur stdDeviation="1.5" result="blur2" />
      <feMerge>
        <feMergeNode in="blur1" />
        <feMergeNode in="blur2" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <!-- Gradiente Neon Multicor Vibrante (Ciano -> Azul -> Violeta -> Magenta) -->
    <linearGradient id="neonCometGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00f0ff" />
      <stop offset="30%" stop-color="#3b82f6" />
      <stop offset="65%" stop-color="#a855f7" />
      <stop offset="100%" stop-color="#ec4899" />
    </linearGradient>
    <filter id="cyanGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="4" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
    <linearGradient id="cardBorder" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00f0ff" stop-opacity="0.8" />
      <stop offset="50%" stop-color="#0284c7" stop-opacity="0.4" />
      <stop offset="100%" stop-color="#3b82f6" stop-opacity="0.7" />
    </linearGradient>
    <linearGradient id="screenGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#082f49" />
      <stop offset="100%" stop-color="#021526" />
    </linearGradient>
    <style>
      .card-title { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; font-size: 14px; font-weight: 700; fill: #ffffff; }
      .card-desc { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; font-size: 11px; fill: #94a3b8; }
      .tag-txt { font-family: 'Fira Code', monospace; font-size: 9px; font-weight: 600; fill: #67e8f9; }
      .category { font-family: 'Fira Code', monospace; font-size: 10px; font-weight: bold; fill: #22d3ee; letter-spacing: 0.5px; }
      .arrow { font-family: 'Fira Code', monospace; font-size: 11.5px; fill: #22d3ee; font-weight: bold; }

      /* Camadas de Interface Flutuando à Frente do Monitor */
      @keyframes floatUI {
        0%, 100% { transform: translateY(0px) translateX(0px); }
        50% { transform: translateY(-5px) translateX(-2px); }
      }
      .ui-layer {
        animation: floatUI 3.5s ease-in-out infinite;
      }
    
      /* Sincronizacao Cometa Neon: Passo 9 (57.12% a 64.26%) */
      @keyframes cometSweep9 {
        0%, 57.12% { stroke-dashoffset: 1120; opacity: 0; }
        57.52% { opacity: 1; }
        63.86% { opacity: 1; }
        64.26%, 100% { stroke-dashoffset: 0; opacity: 0; }
      }
      .comet-beam {
        stroke-dasharray: 168 952;
        animation: cometSweep9 21s linear infinite;
        pointer-events: none;
      }
    </style>
  </defs>

  <!-- Background Card -->
  <rect x="1.5" y="1.5" width="417" height="143" rx="14" fill="#080c14" stroke="url(#cardBorder)" stroke-width="1.4" />
  <rect class="comet-beam" x="1.5" y="1.5" width="417" height="143" rx="14" fill="none" stroke="url(#neonCometGrad)" stroke-width="2.6" stroke-linecap="round" filter="url(#neonCometGlow)" pointer-events="none" />

  <!-- Ambient Light -->
  <circle cx="375" cy="42" r="35" fill="#00f0ff" fill-opacity="0.08" filter="url(#cyanGlow)" />

  <!-- Vector Browser Window Icon Left -->
  <rect x="20" y="18" width="28" height="28" rx="7" fill="#083344" fill-opacity="0.7" stroke="#06b6d4" stroke-opacity="0.5" stroke-width="1.2" />
  <rect x="25" y="24" width="18" height="15" rx="2" stroke="#22d3ee" stroke-width="1.4" fill="none" />
  <line x1="25" y1="28.5" x2="43" y2="28.5" stroke="#22d3ee" stroke-width="1.2" />
  <circle cx="28" cy="26.5" r="0.9" fill="#22d3ee" />
  <circle cx="31" cy="26.5" r="0.9" fill="#22d3ee" />

  <text x="56" y="30" class="category">PLATAFORMA WEB</text>
  <text x="56" y="42" class="arrow">webuildsites.com.br ↗</text>

  <!-- ================= MONITOR / DISPLAY HOLOGRÁFICO 3D COM CAMADAS ================= -->
  <!-- Base e Pedestal do Monitor 3D -->
  <ellipse cx="375" cy="62" rx="14" ry="4" fill="#032541" stroke="#00f0ff" stroke-width="0.8" />
  <line x1="375" y1="50" x2="375" y2="60" stroke="#00f0ff" stroke-width="2" stroke-linecap="round" />

  <!-- Moldura e Tela do Monitor 3D Isométrico (Perspectiva) -->
  <!-- Gabinete Traseiro com Profundidade 3D -->
  <polygon points="356,22 396,16 396,48 356,54" fill="#021526" stroke="#00f0ff" stroke-opacity="0.5" stroke-width="1.2" />
  <!-- Tela Emissiva de Luz Ciano -->
  <polygon points="358,24 394,18 394,46 358,52" fill="url(#screenGrad)" stroke="#38bdf8" stroke-width="0.8" />

  <!-- Linha do topo do browser no monitor -->
  <line x1="358" y1="28" x2="394" y2="22" stroke="#22d3ee" stroke-opacity="0.5" stroke-width="0.8" />
  <circle cx="362" cy="28.5" r="0.8" fill="#22d3ee" />
  <circle cx="365" cy="28" r="0.8" fill="#22d3ee" />

  <!-- Camada Holográfica de UI Flutuante (Salto para Fora da Tela em 3D) -->
  <g class="ui-layer">
    <!-- Janela de Componente Web Flutuando em 3D à Frente -->
    <polygon points="350,28 382,23 382,45 350,50" fill="#0c4a6e" fill-opacity="0.85" stroke="#00f0ff" stroke-width="1.2" filter="url(#cyanGlow)" />
    <!-- Barras de Layout da Interface Flutuante -->
    <line x1="354" y1="34" x2="372" y2="31" stroke="#ffffff" stroke-width="1.2" stroke-linecap="round" />
    <line x1="354" y1="39" x2="378" y2="35.5" stroke="#38bdf8" stroke-width="1" stroke-linecap="round" />
    <line x1="354" y1="44" x2="368" y2="41.5" stroke="#38bdf8" stroke-width="1" stroke-linecap="round" />
    <!-- Botão Call to Action Neon na UI -->
    <polygon points="372,40 379,39 379,43 372,44" fill="#00f0ff" />
  </g>

  <!-- Title -->
  <text x="20" y="73" class="card-title">WebuildSites • Criação de Sites</text>

  <!-- Description -->
  <text x="20" y="93" class="card-desc">Plataforma para criação, publicação e gestão de websites</text>
  <text x="20" y="108" class="card-desc">de alta conversão, hospedado em produção na Vercel.</text>

  <!-- Chips -->
  <g transform="translate(20, 117)">
    <rect width="66" height="20" rx="5" fill="#083344" fill-opacity="0.5" stroke="#06b6d4" stroke-opacity="0.3" />
    <text x="33" y="13.5" text-anchor="middle" class="tag-txt">Next.js</text>
  </g>
  <g transform="translate(92, 117)">
    <rect width="78" height="20" rx="5" fill="#083344" fill-opacity="0.5" stroke="#06b6d4" stroke-opacity="0.3" />
    <text x="39" y="13.5" text-anchor="middle" class="tag-txt">TypeScript</text>
  </g>
  <g transform="translate(176, 117)">
    <rect width="66" height="20" rx="5" fill="#083344" fill-opacity="0.5" stroke="#06b6d4" stroke-opacity="0.3" />
    <text x="33" y="13.5" text-anchor="middle" class="tag-txt">Vercel</text>
  </g>
</svg>
