<svg width="100%" height="auto" viewBox="0 0 425 90" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Filtro de Brilho Neon Pré-existente (preservado para o círculo decorativo) -->
    <filter id="spotGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3.5" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <!-- Filtro de Brilho Neon Seguro Contra Clipping -->
    <filter id="neonCometGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur1" />
      <feGaussianBlur stdDeviation="1.5" result="blur2" />
      <feMerge>
        <feMergeNode in="blur1" />
        <feMergeNode in="blur2" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <!-- Gradiente Neon Multicor Vibrante (Ciano -> Azul -> Violeta -> Magenta) -->
    <linearGradient id="neonCometGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00f0ff" />
      <stop offset="30%" stop-color="#3b82f6" />
      <stop offset="65%" stop-color="#a855f7" />
      <stop offset="100%" stop-color="#ec4899" />
    </linearGradient>

    <style>
      .track-title { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; font-size: 13px; font-weight: 700; fill: #ffffff; }
      .track-sub { font-family: 'Fira Code', monospace; font-size: 10px; fill: #94a3b8; }
      .tag-text { font-family: 'Fira Code', monospace; font-size: 9px; font-weight: 700; fill: #34d399; letter-spacing: 0.5px; }
      .time-txt { font-family: 'Fira Code', monospace; font-size: 8px; fill: #64748b; }
      @keyframes eqBar1 { 0%, 100% { height: 4px; y: 16px; } 50% { height: 16px; y: 4px; } }
      @keyframes eqBar2 { 0%, 100% { height: 6px; y: 14px; } 50% { height: 19px; y: 1px; } }
      @keyframes eqBar3 { 0%, 100% { height: 4px; y: 16px; } 50% { height: 13px; y: 7px; } }
      @keyframes eqBar4 { 0%, 100% { height: 5px; y: 15px; } 50% { height: 17px; y: 3px; } }
      .b1 { animation: eqBar1 0.8s ease-in-out infinite; }
      .b2 { animation: eqBar2 1.1s ease-in-out infinite 0.2s; }
      .b3 { animation: eqBar3 0.7s ease-in-out infinite 0.4s; }
      .b4 { animation: eqBar4 0.9s ease-in-out infinite 0.1s; }

      /* Cometa Neon Sequencial: Card 7 (9.0s a 10.5s / 42.857% a 50.000%) */
      @keyframes cometSweep7 {
        0%, 42.857% { stroke-dashoffset: 1001; opacity: 0; }
        43.357% { opacity: 1; }
        49.500% { opacity: 1; }
        50.000%, 100% { stroke-dashoffset: 0; opacity: 0; }
      }
      .comet-beam {
        stroke-dasharray: 180 821;
        animation: cometSweep7 21s linear infinite;
        pointer-events: none;
      }
    </style>
  </defs>

  <!-- Base Card Static Border -->
  <rect x="1" y="1" width="423" height="88" rx="12" fill="#06090e" stroke="#10b981" stroke-opacity="0.25" stroke-width="1.2" />
  <rect class="comet-beam" x="1.5" y="1.5" width="423" height="88" rx="12" fill="none" stroke="url(#neonCometGrad)" stroke-width="2.6" stroke-linecap="round" filter="url(#neonCometGlow)" pointer-events="none" />
  
  <!-- Feixe Cometa Neon Viajante (Card 7: 9.0s - 10.5s) -->
  <circle cx="390" cy="22" r="30" fill="#10b981" fill-opacity="0.08" filter="url(#spotGlow)" />

  <!-- Top Line: Equalizer + Tag -->
  <g transform="translate(16, 12)">
    <rect x="0" y="15" width="2.5" height="5" rx="1" fill="#10b981" class="b1" />
    <rect x="5" y="13" width="2.5" height="7" rx="1" fill="#10b981" class="b2" />
    <rect x="10" y="15" width="2.5" height="5" rx="1" fill="#10b981" class="b3" />
    <rect x="15" y="14" width="2.5" height="6" rx="1" fill="#10b981" class="b4" />
    <text x="28" y="18" class="tag-text">CODING SOUNDTRACK • SPOTIFY ON REPEAT</text>
  </g>

  <!-- Album / Spotify Art Icon Box -->
  <g transform="translate(16, 38)">
    <rect width="36" height="36" rx="9" fill="#042f2e" stroke="#10b981" stroke-opacity="0.5" stroke-width="1" />
    <path d="M18 10C13.58 10 10 13.58 10 18C10 22.42 13.58 26 18 26C22.42 26 26 22.42 26 18C26 13.58 22.42 10 18 10ZM21.68 21.56C21.52 21.8 21.24 21.88 21 21.72C19.12 20.56 16.76 20.32 13.96 20.96C13.68 21.04 13.44 20.84 13.36 20.6C13.28 20.32 13.48 20.08 13.72 20C16.76 19.32 19.4 19.6 21.48 20.88C21.76 21 21.8 21.32 21.68 21.56ZM22.68 19.4C22.48 19.72 22.08 19.84 21.76 19.64C19.6 18.32 16.28 17.92 13.44 18.8C13.08 18.92 12.68 18.72 12.56 18.36C12.44 18 12.64 17.6 13 17.48C16.2 16.52 19.88 16.96 22.44 18.52C22.76 18.68 22.84 19.12 22.68 19.4ZM22.8 17.16C20.64 15.88 16.28 15.72 13.2 16.64C12.72 16.8 12.2 16.52 12.04 16.04C11.88 15.56 12.16 15.04 12.64 14.88C16.12 13.84 20.92 14.04 23.48 15.56C23.92 15.8 24.08 16.4 23.8 16.84C23.56 17.24 23.2 17.36 22.8 17.16Z" fill="#34d399" />
  </g>

  <!-- Track Details -->
  <text x="62" y="52" class="track-title">Cyberpunk Synthwave &amp; Lo-Fi</text>
  <text x="62" y="67" class="track-sub">Deep Focus &amp; Flow Session</text>

  <!-- Progress Bar (Right Side) -->
  <g transform="translate(270, 52)">
    <rect width="138" height="4" rx="2" fill="#1e293b" />
    <rect width="90" height="4" rx="2" fill="#10b981" />
    <circle cx="90" cy="2" r="4" fill="#34d399" />
    <text x="0" y="16" class="time-txt">02:41</text>
    <text x="138" y="16" text-anchor="end" class="time-txt">03:50</text>
  </g>
</svg>
