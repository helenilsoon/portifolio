    <rect width="124" height="32" rx="7" fill="url(#pillBg)" stroke="#0284c7" stroke-opacity="0.45" stroke-width="1" />
    <rect x="11" y="13" width="2.5" height="2.5" fill="#38bdf8" />
    <rect x="14.5" y="13" width="2.5" height="2.5" fill="#38bdf8" />
    <rect x="14.5" y="10" width="2.5" height="2.5" fill="#38bdf8" />
