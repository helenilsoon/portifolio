    <path d="M13 19.5H21C22.5 19.5 23 18.2 23 17C23 16 21.8 15 20.5 15.3C20 13.5 18.5 12.5 16.8 12.5C15 12.5 13.8 13.5 13.4 15.2C12.5 15.5 12 16.2 12 17C12 18.5 12.5 19.5 13 19.5Z" fill="#f97316" />
