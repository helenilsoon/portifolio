<svg width="100%" height="auto" viewBox="0 0 425 395" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <filter id="stackGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
    <linearGradient id="stackBorder" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00f0ff" stop-opacity="0.85" />
      <stop offset="50%" stop-color="#3b82f6" stop-opacity="0.4" />
      <stop offset="100%" stop-color="#a855f7" stop-opacity="0.75" />
    </linearGradient>
    <linearGradient id="pillBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0e1626" />
      <stop offset="100%" stop-color="#070b14" />
    </linearGradient>

    <!-- Filtro de Brilho Neon Seguro Contra Clipping -->
    <filter id="neonCometGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur1" />
      <feGaussianBlur stdDeviation="1.5" result="blur2" />
      <feMerge>
        <feMergeNode in="blur1" />
        <feMergeNode in="blur2" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <!-- Gradiente Neon Multicor Vibrante (Ciano -> Azul -> Violeta -> Magenta) -->
    <linearGradient id="neonCometGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00f0ff" />
      <stop offset="30%" stop-color="#3b82f6" />
      <stop offset="65%" stop-color="#a855f7" />
      <stop offset="100%" stop-color="#ec4899" />
    </linearGradient>
    <style>
      .head-title { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; font-size: 14.5px; font-weight: 700; fill: #ffffff; letter-spacing: 0.5px; }
      .cat-title { font-family: 'Fira Code', monospace; font-size: 10.5px; font-weight: 700; letter-spacing: 1px; fill: #00f0ff; }
      .pill-name { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; font-size: 11.5px; font-weight: 600; fill: #f1f5f9; }
      /* Sincronização do Cometa Neon: Janela 2 (1.5s a 3.0s / 7.143% a 14.286%) */
      @keyframes cometSweep2 {
        0%, 7.143% { stroke-dashoffset: 1604; opacity: 0; }
        7.643% { opacity: 1; }
        13.786% { opacity: 1; }
        14.286%, 100% { stroke-dashoffset: 0; opacity: 0; }
      }
      .comet-beam {
        stroke-dasharray: 290 1314;
        animation: cometSweep2 21s linear infinite;
        pointer-events: none;
      }
    </style>
  </defs>

  <!-- Container Base Card -->
  <rect x="1.5" y="1.5" width="422" height="392" rx="14" fill="#070a12" stroke="url(#stackBorder)" stroke-width="1.5" />
  <rect class="comet-beam" x="1.5" y="1.5" width="422" height="392" rx="14" fill="none" stroke="url(#neonCometGrad)" stroke-width="2.6" stroke-linecap="round" filter="url(#neonCometGlow)" pointer-events="none" />

  <!-- Feixe Cometa Neon Viajante (Card 2: 1.5s - 3.0s) -->
  <!-- Ambient Neon Aura -->
  <circle cx="390" cy="40" r="45" fill="#00f0ff" fill-opacity="0.08" filter="url(#stackGlow)" />
  <circle cx="35" cy="350" r="45" fill="#a855f7" fill-opacity="0.06" filter="url(#stackGlow)" />

  <!-- Header -->
  <g transform="translate(18, 16)">
    <rect width="26" height="26" rx="6" fill="#002b3d" stroke="#00f0ff" stroke-opacity="0.6" stroke-width="1.2" />
    <path d="M14 5L7 15H14L12 21L19 12H12L14 5Z" fill="#00f0ff" />
    <text x="36" y="18" class="head-title">Stack de Produção</text>
    <rect x="315" y="4" width="74" height="20" rx="5" fill="#022c22" stroke="#10b981" stroke-opacity="0.4" stroke-width="1" />
    <circle cx="325" cy="14" r="3" fill="#10b981" />
    <text x="358" y="17.5" font-family="'Fira Code', monospace" font-size="8.5" fill="#34d399" font-weight="700" text-anchor="middle">VERIFICADO</text>
  </g>

