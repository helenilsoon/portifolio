<svg width="100%" height="auto" viewBox="0 0 425 56" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Filtro de Glow Neon Seguro Contra Clipping -->
    <filter id="neonCometGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur1" />
      <feGaussianBlur stdDeviation="1.5" result="blur2" />
      <feMerge>
        <feMergeNode in="blur1" />
        <feMergeNode in="blur2" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <!-- Gradiente Neon Multicor Vibrante (Ciano -> Azul -> Roxo -> Magenta) -->
    <linearGradient id="neonCometGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00f0ff" />
      <stop offset="30%" stop-color="#3b82f6" />
      <stop offset="65%" stop-color="#a855f7" />
      <stop offset="100%" stop-color="#ec4899" />
    </linearGradient>

    <style>
      .btn-cat { font-family: 'Fira Code', monospace; font-size: 9.5px; font-weight: 700; fill: #c084fc; letter-spacing: 0.5px; }
      .btn-url { font-family: 'Fira Code', monospace; font-size: 10px; fill: #94a3b8; }

      /* Animação Sincronizada do Feixe Cometa Multicor (Card 4: 4.5s a 6.0s) */
      @keyframes cometSweep4 {
        0%, 21.429% { stroke-dashoffset: 933; opacity: 0; }
        21.929% { opacity: 1; }
        28.071% { opacity: 1; }
        28.571%, 100% { stroke-dashoffset: 0; opacity: 0; }
      }
      .comet-beam {
        stroke-dasharray: 170 763;
        animation: cometSweep4 21s linear infinite;
        pointer-events: none;
      }
    </style>
  </defs>

  <!-- Base Card Static Border -->
  <rect x="1" y="1" width="423" height="54" rx="12" fill="#200d36" fill-opacity="0.4" stroke="#a855f7" stroke-opacity="0.25" stroke-width="1.2" />
  <rect class="comet-beam" x="1.5" y="1.5" width="423" height="54" rx="12" fill="none" stroke="url(#neonCometGrad)" stroke-width="2.6" stroke-linecap="round" filter="url(#neonCometGlow)" pointer-events="none" />
  
  <!-- Feixe Cometa Neon Multicor (Ciano, Azul, Roxo e Magenta) -->
  <!-- Icon Box -->
  <g transform="translate(14, 11)">
    <rect width="34" height="34" rx="9" fill="#2e1065" stroke="#a855f7" stroke-opacity="0.5" stroke-width="1" />
    <rect x="8" y="10" width="18" height="14" rx="3" stroke="#c084fc" stroke-width="1.3" fill="none" />
    <path d="M8 12L17 18L26 12" stroke="#c084fc" stroke-width="1.2" stroke-linecap="round" />
  </g>

  <!-- Texts -->
  <text x="58" y="24" class="btn-cat">E-MAIL PROFISSIONAL ✉</text>
  <text x="58" y="42" class="btn-url">helenilsoon@gmail.com</text>

  <!-- Right Pill -->
  <g transform="translate(335, 18)">
    <rect width="76" height="20" rx="6" fill="#3b0764" stroke="#a855f7" stroke-opacity="0.5" stroke-width="1" />
    <text x="38" y="13.5" font-family="'Fira Code', monospace" font-size="8.5" fill="#d8b4fe" font-weight="700" text-anchor="middle">RESPOSTA 24H</text>
  </g>
</svg>
