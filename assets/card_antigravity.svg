<svg width="100%" height="auto" viewBox="0 0 860 126" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Filtro de Brilho Neon Seguro -->
    <filter id="neonCometGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3.5" result="blur1" />
      <feGaussianBlur stdDeviation="1.5" result="blur2" />
      <feMerge>
        <feMergeNode in="blur1" />
        <feMergeNode in="blur2" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <!-- Gradiente Neon Multicor Vibrante (Ciano -> Azul -> Violeta -> Magenta) -->
    <linearGradient id="neonCometGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00f0ff" />
      <stop offset="30%" stop-color="#3b82f6" />
      <stop offset="65%" stop-color="#a855f7" />
      <stop offset="100%" stop-color="#ec4899" />
    </linearGradient>
    <filter id="fuchsiaCyanGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00f0ff" stop-opacity="0.8" />
      <stop offset="50%" stop-color="#3b82f6" stop-opacity="0.4" />
      <stop offset="100%" stop-color="#d946ef" stop-opacity="0.8" />
    </linearGradient>
    <linearGradient id="phoneScreen" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#082f49" />
      <stop offset="100%" stop-color="#2e1065" />
    </linearGradient>
    <style>
      .card-title { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; font-size: 15px; font-weight: 700; fill: #ffffff; }
      .card-desc { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; font-size: 11.5px; fill: #94a3b8; }
      .tag-txt { font-family: 'Fira Code', monospace; font-size: 9.5px; font-weight: 600; fill: #67e8f9; }
      .category { font-family: 'Fira Code', monospace; font-size: 10px; font-weight: bold; fill: #00f0ff; letter-spacing: 0.5px; }
      .arrow { font-family: 'Fira Code', monospace; font-size: 11.5px; fill: #f472b6; font-weight: bold; }

      /* Camada de App Saltando para fora do Smartphone 3D */
      @keyframes floatAppLayer {
        0%, 100% { transform: translateY(0px) translateX(0px); }
        50% { transform: translateY(-7px) translateX(-4px); }
      }
      @keyframes floatDevice {
        0%, 100% { transform: translateY(0px); }
        50% { transform: translateY(-3px); }
      }
      .phone-body {
        animation: floatDevice 4s ease-in-out infinite;
      }
      .app-layer {
        animation: floatAppLayer 3.2s ease-in-out infinite;
      }
    
      /* Sincronizacao Cometa Neon: Passo 12 (78.54% a 85.68%) */
      @keyframes cometSweep12 {
        0%, 78.54% { stroke-dashoffset: 1960; opacity: 0; }
        78.94% { opacity: 1; }
        85.28% { opacity: 1; }
        85.68%, 100% { stroke-dashoffset: 0; opacity: 0; }
      }
      .comet-beam {
        stroke-dasharray: 294 1666;
        animation: cometSweep12 21s linear infinite;
        pointer-events: none;
      }
    </style>
  </defs>

  <rect x="1.5" y="1.5" width="857" height="123" rx="14" fill="#080c14" stroke="url(#cardGrad)" stroke-width="1.4" />
  <rect class="comet-beam" x="1.5" y="1.5" width="857" height="123" rx="14" fill="none" stroke="url(#neonCometGrad)" stroke-width="2.6" stroke-linecap="round" filter="url(#neonCometGlow)" pointer-events="none" />
  <circle cx="790" cy="62" r="45" fill="#00f0ff" fill-opacity="0.08" filter="url(#fuchsiaCyanGlow)" />

  <!-- Vector Mobile Device / Chip Icon Left -->
  <rect x="24" y="20" width="30" height="30" rx="8" fill="#083344" stroke="#00f0ff" stroke-opacity="0.5" stroke-width="1.2" />
  <rect x="31" y="26" width="16" height="18" rx="2" stroke="#22d3ee" stroke-width="1.5" fill="none" />
  <circle cx="39" cy="40" r="1" fill="#22d3ee" />

  <text x="64" y="32" class="category">OPEN SOURCE ECOSYSTEM • WEBUILDSOFT</text>
  <text x="64" y="45" class="arrow">Download Releases v1.4.1 (Android, Windows, macOS, Linux) ↗</text>

  <!-- Title -->
  <text x="24" y="74" class="card-title">Antigravity Mobile &amp; Companion Server</text>

  <!-- Description -->
  <text x="24" y="93" class="card-desc">Companion client mobile em Flutter (Android) e servidor de alta performance em Go 1.24 com WebSockets e túneis Cloudflare Zero Trust.</text>

  <!-- Chips Top Right -->
  <g transform="translate(520, 20)">
    <rect width="86" height="22" rx="6" fill="#083344" fill-opacity="0.6" stroke="#00f0ff" stroke-opacity="0.4" />
    <text x="43" y="15" text-anchor="middle" class="tag-txt">Go 1.24</text>
  </g>
  <g transform="translate(616, 20)">
    <rect width="100" height="22" rx="6" fill="#701a75" fill-opacity="0.6" stroke="#d946ef" stroke-opacity="0.4" />
    <text x="50" y="15" text-anchor="middle" class="tag-txt" fill="#f472b6">Flutter Client</text>
  </g>

  <!-- ================= SMARTPHONE 3D ISOMÉTRICO COM CAMADA DE APP SALTANDO ================= -->
  <!-- Sombra 3D no chão -->
  <ellipse cx="790" cy="104" rx="30" ry="8" fill="#000000" fill-opacity="0.6" filter="url(#fuchsiaCyanGlow)" />

  <!-- Corpo do Smartphone 3D Isométrico -->
  <g class="phone-body">
    <!-- Gabinete Lateral 3D (Espessura do Aparelho) -->
    <polygon points="765,40 795,22 815,35 785,53" fill="#032541" stroke="#00f0ff" stroke-opacity="0.6" stroke-width="1.2" />
    <polygon points="765,40 765,95 785,108 785,53" fill="#021526" stroke="#00f0ff" stroke-width="1.2" />
    <polygon points="785,53 815,35 815,90 785,108" fill="#082f49" stroke="#38bdf8" stroke-width="1.2" />

    <!-- Tela do Smartphone com Brilho Gradiente -->
    <polygon points="786,55 813,38 813,88 786,105" fill="url(#phoneScreen)" stroke="#00f0ff" stroke-width="1" />
    
    <!-- Câmera Frontal Notch / Alto-falante -->
    <circle cx="799" cy="46" r="1.2" fill="#00f0ff" />
  </g>

  <!-- Camada de Interface do App (Saltando para Fora da Tela em 3D) -->
  <g class="app-layer">
    <!-- Card Holográfico Flutuando no Ar à Frente do Smartphone -->
    <polygon points="772,50 802,32 802,68 772,86" fill="#701a75" fill-opacity="0.85" stroke="#d946ef" stroke-width="1.3" filter="url(#fuchsiaCyanGlow)" />
    
    <!-- Linhas e Componentes da Tela do App -->
    <line x1="778" y1="58" x2="794" y2="48" stroke="#ffffff" stroke-width="1.2" stroke-linecap="round" />
    <line x1="778" y1="64" x2="798" y2="52" stroke="#f472b6" stroke-width="1" stroke-linecap="round" />
    <line x1="778" y1="70" x2="792" y2="61" stroke="#38bdf8" stroke-width="1" stroke-linecap="round" />

    <!-- Botão de Ação Flutuante no App -->
    <circle cx="788" cy="74" r="3" fill="#00f0ff" filter="url(#fuchsiaCyanGlow)" />
  </g>
</svg>
