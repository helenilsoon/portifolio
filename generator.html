<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Neon Profile Cards • Gerador de Perfil GitHub</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Fira+Code:wght@400;600;700&family=Inter:wght@400;600;700;900&display=swap" rel="stylesheet">
  <style>
    body { font-family: 'Inter', sans-serif; background-color: #060911; color: #f1f5f9; }
    .mono { font-family: 'Fira Code', monospace; }
    .neon-border {
      box-shadow: 0 0 20px rgba(0, 240, 255, 0.2), inset 0 0 15px rgba(0, 240, 255, 0.05);
    }
  </style>
</head>
<body class="min-h-screen flex flex-col justify-between p-4 md:p-8">

  <!-- Header -->
  <header class="max-w-6xl mx-auto w-full flex flex-col md:flex-row items-center justify-between pb-6 border-b border-cyan-500/20 mb-8 gap-4">
    <div class="flex items-center gap-3">
      <div class="w-10 h-10 rounded-xl bg-cyan-950/80 border border-cyan-500/50 flex items-center justify-center text-cyan-400 font-bold text-lg shadow-lg">⚡</div>
      <div>
        <h1 class="text-xl font-black tracking-tight text-white flex items-center gap-2">
          <span>NEON PROFILE CARDS</span>
          <span class="text-[10px] font-mono px-2 py-0.5 rounded-full bg-cyan-500/10 border border-cyan-500/30 text-cyan-400">v1.0 API</span>
        </h1>
        <p class="text-xs text-slate-400">Gerador oficial de banners e cards 3D para GitHub Profile</p>
      </div>
    </div>
    <div class="text-right">
      <span class="text-xs font-mono text-emerald-400 flex items-center gap-2">
        <span class="w-2 h-2 rounded-full bg-emerald-400 animate-pulse"></span>
        API Engine: Online • WebuildSoft
      </span>
    </div>
  </header>

  <!-- Main Grid: Form + Live Preview -->
  <main class="max-w-6xl mx-auto w-full grid grid-cols-1 lg:grid-cols-12 gap-8 mb-12">
    
    <!-- Coluna 1: Formulário (5 cols) -->
    <div class="lg:col-span-5 bg-[#0a0f1d] border border-cyan-500/30 rounded-2xl p-6 neon-border space-y-4">
      <div class="flex items-center justify-between pb-3 border-b border-slate-800">
        <h2 class="text-sm font-bold text-cyan-400 font-mono tracking-wider">&gt; CONFIGURAR PERFIL</h2>
        <span class="text-[11px] font-mono text-slate-500">Inputs dinâmicos</span>
      </div>

      <div class="space-y-3 text-xs">
        <div>
          <label class="block font-mono text-slate-300 mb-1">Nome Completo</label>
          <input type="text" id="inputName" value="HELENILSON OLIVEIRA" class="w-full bg-[#060911] border border-slate-700 rounded-lg px-3 py-2 text-white focus:outline-none focus:border-cyan-400 font-bold" />
        </div>

        <div>
          <label class="block font-mono text-slate-300 mb-1">Cargo / Especialidade</label>
          <input type="text" id="inputRole" value="FULL STACK SOFTWARE DEVELOPER • WEB ARCHITECT" class="w-full bg-[#060911] border border-slate-700 rounded-lg px-3 py-2 text-white focus:outline-none focus:border-cyan-400 font-mono" />
        </div>

        <div>
          <label class="block font-mono text-slate-300 mb-1">Bio / Resumo Profissional</label>
          <input type="text" id="inputBio" value="Construindo soluções web escaláveis, sistemas digitais e ecossistemas de alta performance." class="w-full bg-[#060911] border border-slate-700 rounded-lg px-3 py-2 text-white focus:outline-none focus:border-cyan-400" />
        </div>

        <div class="grid grid-cols-2 gap-3">
          <div>
            <label class="block font-mono text-slate-300 mb-1">Organização</label>
            <input type="text" id="inputOrg" value="@WebuildSoft ↗" class="w-full bg-[#060911] border border-slate-700 rounded-lg px-3 py-2 text-white focus:outline-none focus:border-cyan-400 font-mono" />
          </div>
          <div>
            <label class="block font-mono text-slate-300 mb-1">Repositórios</label>
            <input type="text" id="inputRepos" value="37+ Criados" class="w-full bg-[#060911] border border-slate-700 rounded-lg px-3 py-2 text-white focus:outline-none focus:border-cyan-400 font-mono" />
          </div>
        </div>

        <div class="grid grid-cols-2 gap-3">
          <div>
            <label class="block font-mono text-slate-300 mb-1">Disponibilidade</label>
            <input type="text" id="inputAvail" value="Freelance & Contratos" class="w-full bg-[#060911] border border-slate-700 rounded-lg px-3 py-2 text-white focus:outline-none focus:border-cyan-400 font-mono" />
          </div>
          <div>
            <label class="block font-mono text-slate-300 mb-1">Atuação</label>
            <input type="text" id="inputBadge4" value="Full Stack Dev" class="w-full bg-[#060911] border border-slate-700 rounded-lg px-3 py-2 text-white focus:outline-none focus:border-cyan-400 font-mono" />
          </div>
        </div>
      </div>
    </div>

    <!-- Coluna 2: Live Preview & Código Markdown (7 cols) -->
    <div class="lg:col-span-7 flex flex-col justify-between space-y-6">
      
      <!-- Preview Container -->
      <div class="bg-[#0a0f1d] border border-slate-800 rounded-2xl p-5">
        <div class="flex items-center justify-between pb-3 border-b border-slate-800 mb-4">
          <span class="text-xs font-mono text-cyan-400 font-bold flex items-center gap-2">
            <span class="w-2 h-2 rounded-full bg-cyan-400"></span> LIVE PREVIEW
          </span>
          <span class="text-[11px] font-mono text-slate-500">Renderização SVG 100% Nativa</span>
        </div>

        <div id="previewBox" class="w-full overflow-hidden rounded-xl border border-slate-800/80 bg-[#060911]">
          <!-- SVG inserido via JavaScript em tempo real -->
        </div>
      </div>

      <!-- Output Code & Actions -->
      <div class="bg-[#0a0f1d] border border-cyan-500/20 rounded-2xl p-5 space-y-3">
        <div class="flex items-center justify-between">
          <span class="text-xs font-mono text-fuchsia-400 font-bold">&gt; CÓDIGO MARKDOWN PARA SEU README.MD</span>
          <button id="btnCopy" class="px-3 py-1.5 rounded-lg bg-cyan-500 hover:bg-cyan-400 text-slate-950 font-bold text-xs transition-all shadow-md flex items-center gap-1.5">
            <span>Copiar Markdown</span>
          </button>
        </div>
        <textarea id="outputMarkdown" readonly class="w-full bg-[#060911] border border-slate-800 rounded-lg p-3 text-xs font-mono text-slate-300 focus:outline-none resize-none h-20"></textarea>
      </div>

    </div>
  </main>

  <!-- Footer -->
  <footer class="max-w-6xl mx-auto w-full pt-6 border-t border-slate-800 text-center text-xs font-mono text-slate-500">
    Desenvolvido por <a href="https://github.com/helenilsoon" class="text-cyan-400 hover:underline">Helenilson Oliveira</a> • WebuildSoft © 2026
  </footer>

  <script>
    const inputs = ['inputName', 'inputRole', 'inputBio', 'inputOrg', 'inputRepos', 'inputAvail', 'inputBadge4'];
    
    function updatePreview() {
      const name = document.getElementById('inputName').value || 'DEV NAME';
      const role = document.getElementById('inputRole').value || 'FULL STACK DEVELOPER';
      const bio = document.getElementById('inputBio').value || '';
      const org = document.getElementById('inputOrg').value || '@WebuildSoft ↗';
      const repos = document.getElementById('inputRepos').value || '30+ Criados';
      const avail = document.getElementById('inputAvail').value || 'Disponível';
      const badge4 = document.getElementById('inputBadge4').value || 'Full Stack';

      const apiUrl = `https://neon-profile-cards.lnki.pro/api/header?name=${encodeURIComponent(name)}&role=${encodeURIComponent(role)}&org=${encodeURIComponent(org)}&repos=${encodeURIComponent(repos)}&availability=${encodeURIComponent(avail)}&badge4=${encodeURIComponent(badge4)}`;

      // Atualiza o SVG no preview
      const svgCode = `
      <svg width="100%" height="auto" viewBox="0 0 900 280" fill="none" xmlns="http://www.w3.org/2000/svg">
        <defs>
          <linearGradient id="neonGradient" x1="0%" y1="0%" x2="100%" y2="0%">
            <stop offset="0%" stop-color="#22d3ee" /><stop offset="50%" stop-color="#99f6e4" /><stop offset="100%" stop-color="#d946ef" />
          </linearGradient>
          <linearGradient id="cardBorder" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" stop-color="#06b6d4" stop-opacity="0.8" /><stop offset="50%" stop-color="#3b82f6" stop-opacity="0.3" /><stop offset="100%" stop-color="#d946ef" stop-opacity="0.6" />
          </linearGradient>
          <linearGradient id="bgDark" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" stop-color="#07090e" /><stop offset="100%" stop-color="#0c101a" />
          </linearGradient>
          <linearGradient id="neonCometGrad" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" stop-color="#00f0ff" /><stop offset="30%" stop-color="#3b82f6" /><stop offset="65%" stop-color="#a855f7" /><stop offset="100%" stop-color="#ec4899" />
          </linearGradient>
          <style>
            .title-text { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; font-weight: 900; font-size: 38px; }
            .mono-text { font-family: 'Fira Code', monospace; }
            @keyframes cometRun { 0% { stroke-dashoffset: 2344; } 100% { stroke-dashoffset: 0; } }
            .comet-beam { stroke-dasharray: 280 2064; animation: cometRun 6s linear infinite; pointer-events: none; }
          </style>
        </defs>

        <rect x="2" y="2" width="896" height="276" rx="16" fill="url(#bgDark)" stroke="url(#cardBorder)" stroke-width="1.5" />
        <rect class="comet-beam" x="2" y="2" width="896" height="276" rx="16" fill="none" stroke="url(#neonCometGrad)" stroke-width="2.6" stroke-linecap="round" />

        <rect x="36" y="26" width="310" height="26" rx="13" fill="#083344" fill-opacity="0.7" stroke="#06b6d4" stroke-opacity="0.4" stroke-width="1" />
        <circle cx="50" cy="39" r="4.5" fill="#22d3ee" />
        <text x="63" y="43" fill="#67e8f9" class="mono-text" font-size="11" font-weight="600">STATUS: SYSTEM ONLINE • READY</text>
        <text x="864" y="43" fill="#f472b6" class="mono-text" font-size="11" font-weight="600" text-anchor="end">MANAUS, BR (GMT-4)</text>

        <text x="36" y="98" fill="url(#neonGradient)" class="title-text">${name}</text>
        <text x="36" y="125" fill="#67e8f9" class="mono-text" font-size="13" font-weight="600">&gt; ${role}</text>
        <text x="36" y="148" fill="#8b949e" class="mono-text" font-size="12">${bio}</text>

        <g transform="translate(36, 185)">
          <rect width="195" height="64" rx="12" fill="#000000" fill-opacity="0.65" stroke="#06b6d4" stroke-opacity="0.35" stroke-width="1.2" />
          <text x="24" y="30" fill="#22d3ee" class="mono-text" font-size="10" font-weight="bold">ORGANIZAÇÃO</text>
          <text x="24" y="49" fill="#ffffff" class="mono-text" font-size="13" font-weight="bold">${org}</text>
        </g>
        <g transform="translate(245, 185)">
          <rect width="195" height="64" rx="12" fill="#000000" fill-opacity="0.65" stroke="#d946ef" stroke-opacity="0.35" stroke-width="1.2" />
          <text x="24" y="30" fill="#f472b6" class="mono-text" font-size="10" font-weight="bold">REPOSITÓRIOS</text>
          <text x="24" y="49" fill="#ffffff" class="mono-text" font-size="13" font-weight="bold">${repos}</text>
        </g>
        <g transform="translate(454, 185)">
          <rect width="195" height="64" rx="12" fill="#000000" fill-opacity="0.65" stroke="#10b981" stroke-opacity="0.35" stroke-width="1.2" />
          <text x="24" y="30" fill="#34d399" class="mono-text" font-size="10" font-weight="bold">DISPONIBILIDADE</text>
          <text x="24" y="49" fill="#ffffff" class="mono-text" font-size="13" font-weight="bold">${avail}</text>
        </g>
        <g transform="translate(663, 185)">
          <rect width="201" height="64" rx="12" fill="#000000" fill-opacity="0.65" stroke="#c084fc" stroke-opacity="0.35" stroke-width="1.2" />
          <text x="24" y="30" fill="#c084fc" class="mono-text" font-size="10" font-weight="bold">ATUAÇÃO</text>
          <text x="24" y="49" fill="#ffffff" class="mono-text" font-size="13" font-weight="bold">${badge4}</text>
        </g>
      </svg>`;

      document.getElementById('previewBox').innerHTML = svgCode;

      // Código Markdown gerado
      const mdCode = `<p align="center">\n  <img src="${apiUrl}" width="100%" alt="${name} - Banner Neon Cyberpunk" />\n</p>`;
      document.getElementById('outputMarkdown').value = mdCode;
    }

    inputs.forEach(id => document.getElementById(id).addEventListener('input', updatePreview));

    document.getElementById('btnCopy').addEventListener('click', () => {
      const copyText = document.getElementById('outputMarkdown');
      copyText.select();
      navigator.clipboard.writeText(copyText.value);
      alert('Código Markdown copiado com sucesso para a área de transferência!');
    });

    updatePreview();
  </script>
</body>
</html>
